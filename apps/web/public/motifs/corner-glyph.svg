<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <g stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
    <!-- outer frame -->
    <path d="M 90 170 C 120 120, 170 90, 230 90 H 510"
          stroke="hsl(var(--knd-line) / 0.28)" stroke-width="2"/>
    <path d="M 90 170 V 510"
          stroke="hsl(var(--knd-line) / 0.22)" stroke-width="2"/>
    <path d="M 90 510 H 430 C 470 510, 500 490, 510 460"
          stroke="hsl(var(--knd-line) / 0.20)" stroke-width="2"/>

    <!-- inner neon trace -->
    <path d="M 140 190 C 170 150, 210 130, 260 130 H 485"
          stroke="hsl(var(--knd-cyan) / 0.22)" stroke-width="1.5"/>
    <path d="M 140 190 V 485"
          stroke="hsl(var(--knd-magenta) / 0.14)" stroke-width="1.5"/>
    <path d="M 140 485 H 400 C 440 485, 468 468, 485 438"
          stroke="hsl(var(--knd-cyan) / 0.16)" stroke-width="1.5"/>

    <!-- circuit petals -->
    <path d="M 210 210 C 250 180, 300 180, 340 210"
          stroke="hsl(var(--knd-cyan) / 0.18)" stroke-width="1.25"/>
    <path d="M 210 210 C 240 250, 240 300, 210 340"
          stroke="hsl(var(--knd-magenta) / 0.12)" stroke-width="1.25"/>

    <!-- nodes -->
    <g>
      <circle cx="140" cy="190" r="4" fill="hsl(var(--knd-cyan) / 0.20)"/>
      <circle cx="260" cy="130" r="3" fill="hsl(var(--knd-magenta) / 0.14)"/>
      <circle cx="485" cy="130" r="3" fill="hsl(var(--knd-cyan) / 0.16)"/>
      <circle cx="140" cy="485" r="3" fill="hsl(var(--knd-magenta) / 0.12)"/>
      <circle cx="485" cy="438" r="3.5" fill="hsl(var(--knd-cyan) / 0.18)"/>
      <circle cx="340" cy="210" r="2.6" fill="hsl(var(--knd-cyan) / 0.16)"/>
      <circle cx="210" cy="340" r="2.6" fill="hsl(var(--knd-magenta) / 0.12)"/>
    </g>
  </g>
</svg>
