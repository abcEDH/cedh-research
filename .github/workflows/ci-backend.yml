name: CI Backend

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/backend/**"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/ci-backend-maintenance.yml"

concurrency:
  group: backend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  data-dictionary:
    name: Validate data dictionary updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check data dictionary updated when migrations change
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "$BASE_REF"

          MIGRATIONS_CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD -- packages/backend/supabase/migrations | wc -l | tr -d ' ')
          DICT_CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD -- packages/backend/docs/data_dictionary.md | wc -l | tr -d ' ')

          if [ "$MIGRATIONS_CHANGED" -gt 0 ] && [ "$DICT_CHANGED" -eq 0 ]; then
            echo "::error::Migrations changed but packages/backend/docs/data_dictionary.md was not updated."
            exit 1
          fi

          echo "Data dictionary check passed."

  lint-and-test:
    name: Backend quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Create venv and install dependencies
        run: uv venv .venv --clear && uv pip install --python .venv/bin/python -r packages/backend/requirements.txt

      - name: Run Ruff check
        run: |
          set -euo pipefail
          changed_files=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- packages/backend/src | grep '\.py$' || true)
          if [ -z "$changed_files" ]; then
            echo "No backend source Python files changed."
            exit 0
          fi
          uv run ruff check $changed_files

      - name: Run Ruff format
        run: |
          set -euo pipefail
          changed_files=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- packages/backend/src | grep '\.py$' || true)
          if [ -z "$changed_files" ]; then
            echo "No backend source Python files changed."
            exit 0
          fi
          uv run ruff format --check $changed_files

      - name: Run unit tests
        run: |
          PYTHONPATH=packages/backend/src uv run python -m unittest discover packages/backend/tests

  backend-validation:
    name: Backend validation and consistency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Create venv and install dependencies
        run: uv venv .venv --clear && uv pip install --python .venv/bin/python -r packages/backend/requirements.txt

      - name: Validate backend views and functions
        run: uv run python packages/backend/src/ci_backend_checks.py views

      - name: Check data integrity
        run: uv run python packages/backend/src/ci_backend_checks.py data-integrity

      - name: Check regional Elo aggregate consistency
        run: uv run python packages/backend/src/ci_backend_checks.py regional-elo

      - name: Smoke-test analytics benchmarks
        run: |
          uv run python packages/backend/src/ci_backend_checks.py benchmark \
            --runs 1 --warmups 0 --smoke-only

      - name: Smoke-test leaderboard recompute
        run: uv run python packages/backend/src/regional_elo.py --smoke-days 30 --dry-run
