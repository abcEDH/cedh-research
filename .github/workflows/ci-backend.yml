name: CI Backend

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/backend/**"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/ci-backend-maintenance.yml"

concurrency:
  group: backend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  data-dictionary:
    name: Validate data dictionary updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkoutbd71901bbe5b1630ceea73d27597364c9af683@v4
        with:
          fetch-depth: 0

      - name: Check data dictionary updated when migrations change
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "$BASE_REF"

          MIGRATIONS_CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD -- packages/backend/supabase/migrations | wc -l | tr -d ' ')
          DICT_CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD -- packages/backend/docs/data_dictionary.md | wc -l | tr -d ' ')

          if [ "$MIGRATIONS_CHANGED" -gt 0 ] && [ "$DICT_CHANGED" -eq 0 ]; then
            echo "::error::Migrations changed but packages/backend/docs/data_dictionary.md was not updated."
            exit 1
          fi

          echo "Data dictionary check passed."

  ingest-smoke:
    name: Backend ingest and leaderboard smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkoutbd71901bbe5b1630ceea73d27597364c9af683@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r packages/backend/requirements.txt

      - name: Run bounded data ingestion
        run: python packages/backend/src/ingest.py --days 7 --min-players 32

      - name: Smoke-test leaderboard recompute
        run: python packages/backend/src/regional_elo.py --smoke-days 30 --dry-run

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-logs
          path: packages/backend/logs/
          retention-days: 30
