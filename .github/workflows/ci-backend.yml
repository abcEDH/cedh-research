name: CI Backend

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/backend/**"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/ci-backend-maintenance.yml"

concurrency:
  group: backend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  ingest-smoke:
    name: Backend ingest and leaderboard smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r packages/backend/requirements.txt

      - name: Run bounded data ingestion
        run: python packages/backend/src/ingest.py --days 7 --min-players 32

      - name: Smoke-test leaderboard recompute
        run: python packages/backend/src/regional_elo.py --smoke-days 30 --dry-run

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-logs
          path: packages/backend/logs/
          retention-days: 30
