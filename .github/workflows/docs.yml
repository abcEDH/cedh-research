name: Docs Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-mermaid.mjs"
      - "scripts/check-repo-hygiene.mjs"
      - "docs/supported-surfaces.md"
      - ".github/pull_request_template.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"

jobs:
  mermaid-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkoutbd71901bbe5b1630ceea73d27597364c9af683@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-nodeea5288caeca8642d1e84afbd3f7d6820020@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Mermaid lint
        run: npm run docs:check
      - name: Repo hygiene
        run: npm run docs:hygiene
