name: Docs Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-mermaid.mjs"
      - ".github/workflows/docs.yml"

jobs:
  mermaid-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Mermaid lint
        run: npm run docs:check
