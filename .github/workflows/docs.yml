name: Docs Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-mermaid.mjs"
      - "scripts/check-repo-hygiene.mjs"
      - "docs/supported-surfaces.md"
      - ".github/pull_request_template.md"
      - "CONTRIBUTING.md"
      - "Justfile"
      - "scripts/quickstart.sh"
      - ".github/workflows/docs.yml"

jobs:
  mermaid-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Mermaid lint
        run: npm run docs:check
      - name: Repo hygiene
        run: npm run docs:hygiene

  quickstart-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install just
        uses: taiki-e/install-action@86e1083c66fd3afa489f3a9a04a326d51621b3e6 # just
      - name: Quickstart smoke test (no backend deps)
        run: just quickstart-no-backend
