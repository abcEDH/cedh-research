name: Docs Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-mermaid.mjs"
      - "scripts/check-repo-hygiene.mjs"
      - "docs/supported-surfaces.md"
      - ".github/pull_request_template.md"
      - "CONTRIBUTING.md"
      - "Justfile"
      - "scripts/quickstart.sh"
      - ".github/workflows/docs.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mermaid-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Mermaid lint
        run: npm run docs:check
      - name: Repo hygiene
        run: npm run docs:hygiene

  quickstart-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Quickstart smoke test (no backend deps)
        run: just quickstart-no-backend
