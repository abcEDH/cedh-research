name: CI Backend Maintenance

on:
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: "Run a non-destructive smoke check or a full Elo refresh"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full
      smoke_days:
        description: "How many recent days to include in the Elo recompute"
        required: false
        default: "30"
      job_id:
        description: "Optional elo_maintenance_jobs UUID for cron-dispatched full refreshes"
        required: false
        default: ""

concurrency:
  group: backend-maintenance-${{ github.ref }}
  cancel-in-progress: true

env:
  TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

# Required secrets:
#   GitHub Actions:
#     TOPDECK_API_KEY       — TopDeck.gg API v2 key
#     SUPABASE_URL          — Supabase project URL (https://msjjihqbxtgjdtapywrj.supabase.co)
#     SUPABASE_SERVICE_KEY  — Supabase service_role key
#   Edge Function (trigger-elo-refresh):
#     GITHUB_PAT            — GitHub fine-grained PAT with actions:write
#     SUPABASE_URL          — same as above
#     SUPABASE_SERVICE_ROLE_KEY — same key as SUPABASE_SERVICE_KEY
#     SUPABASE_ANON_KEY     — Supabase anon/public key
#   pg_cron Vault secrets:
#     project_url           — Supabase project URL
#     anon_key              — Supabase anon key

jobs:
  elo-recompute:
    name: Elo recompute and maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --frozen --project packages/backend

      - name: Recompute global Elo, state activity, and game events
        run: |
          if [ "${{ inputs.refresh_mode }}" = "full" ]; then
            if [ -n "${{ inputs.job_id }}" ]; then
              uv run --project packages/backend python packages/backend/src/regional_elo.py --apply --job-id "${{ inputs.job_id }}"
            else
              uv run --project packages/backend python packages/backend/src/regional_elo.py --apply
            fi
          else
            uv run --project packages/backend python packages/backend/src/regional_elo.py --smoke-days "${{ inputs.smoke_days }}" --dry-run
          fi

      - name: Rebuild player commander profiles
        if: ${{ inputs.refresh_mode == 'full' }}
        run: uv run --project packages/backend python packages/backend/src/rebuild_player_commander_profiles.py

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-logs
          path: packages/backend/logs/
          retention-days: 30

  validate-views:
    runs-on: ubuntu-latest
    needs: elo-recompute
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --frozen --project packages/backend

      - name: Validate backend views and functions
        run: uv run --project packages/backend python packages/backend/src/ci_backend_checks.py views

  validate-data-integrity:
    runs-on: ubuntu-latest
    needs: elo-recompute
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --frozen --project packages/backend

      - name: Check data integrity
        run: uv run --project packages/backend python packages/backend/src/ci_backend_checks.py data-integrity

  validate-regional-elo-consistency:
    runs-on: ubuntu-latest
    needs: elo-recompute
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --frozen --project packages/backend

      - name: Check regional Elo aggregate consistency
        run: uv run --project packages/backend python packages/backend/src/ci_backend_checks.py regional-elo

  benchmark-performance:
    runs-on: ubuntu-latest
    needs: elo-recompute
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --frozen --project packages/backend

      - name: Benchmark analytics surfaces
        run: |
          if [ "${{ inputs.refresh_mode }}" = "full" ]; then
            uv run --project packages/backend python packages/backend/src/ci_backend_checks.py benchmark \
              --output benchmark_results.json
          else
            uv run --project packages/backend python packages/backend/src/ci_backend_checks.py benchmark \
              --smoke-only \
              --output benchmark_results.json
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json

  mark-job-failed:
    name: Mark queued job as failed when any maintenance job fails
    runs-on: ubuntu-latest
    needs:
      - elo-recompute
      - validate-views
      - validate-data-integrity
      - validate-regional-elo-consistency
      - benchmark-performance
    if: >-
      ${{
        always() &&
        inputs.refresh_mode == 'full' &&
        inputs.job_id != '' &&
        (
          contains(join(needs.*.result, ','), 'failure') ||
          contains(join(needs.*.result, ','), 'cancelled')
        )
      }}
    steps:
      - name: Mark queued job as failed in Supabase
        env:
          JOB_ID: ${{ inputs.job_id }}
          JOB_ERROR: GitHub Actions workflow failed in run ${{ github.run_id }}. Inspect the CI Backend Maintenance logs for details.
        run: |
          payload="$(python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          print(json.dumps({
              "status": "failed",
              "completed_at": datetime.now(timezone.utc).isoformat(),
              "error_text": os.environ["JOB_ERROR"][:2000],
          }))
          PY
          )"

          curl --fail-with-body --silent --show-error \
            -X PATCH \
            "$SUPABASE_URL/rest/v1/elo_maintenance_jobs?id=eq.${JOB_ID}&status=in.(pending,dispatched,running)" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data "$payload"
