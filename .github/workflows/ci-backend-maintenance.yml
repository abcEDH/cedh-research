name: CI Backend Maintenance

on:
  schedule:
    - cron: "0 9 * * 3"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/backend/**"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/ci-backend-maintenance.yml"

concurrency:
  group: backend-maintenance-${{ github.ref }}
  cancel-in-progress: true

env:
  TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  ingest:
    name: Backend ingest and leaderboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r packages/backend/requirements.txt

      - name: Run data ingestion
        run: python packages/backend/src/ingest.py --days 7 --min-players 32

      - name: Recompute leaderboard data
        run: python packages/backend/src/regional_elo.py

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-logs
          path: logs/
          retention-days: 30

  validate-views:
    runs-on: ubuntu-latest
    needs: ingest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Validate backend views and functions
        run: python packages/backend/src/ci_backend_checks.py views

  validate-data-integrity:
    runs-on: ubuntu-latest
    needs: ingest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check data integrity
        run: python packages/backend/src/ci_backend_checks.py data-integrity

  validate-regional-elo-consistency:
    runs-on: ubuntu-latest
    needs: ingest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check regional Elo aggregate consistency
        run: python packages/backend/src/ci_backend_checks.py regional-elo

  benchmark-performance:
    runs-on: ubuntu-latest
    needs: ingest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r packages/backend/requirements.txt

      - name: Benchmark analytics surfaces
        run: |
          python packages/backend/src/ci_backend_checks.py benchmark \
            --output benchmark_results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
