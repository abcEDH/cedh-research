name: CI Backend Maintenance

on:
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: "Run a non-destructive smoke check or a full Elo refresh"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full
      smoke_days:
        description: "How many recent days to include in the Elo recompute"
        required: false
        default: "30"
      job_id:
        description: "Optional elo_maintenance_jobs UUID for cron-dispatched full refreshes"
        required: false
        default: ""

concurrency:
  group: backend-maintenance-${{ github.ref }}
  cancel-in-progress: true

env:
  TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

# Required secrets:
#   GitHub Actions:
#     TOPDECK_API_KEY       — TopDeck.gg API v2 key
#     SUPABASE_URL          — Supabase project URL (https://msjjihqbxtgjdtapywrj.supabase.co)
#     SUPABASE_SERVICE_KEY  — Supabase service_role key
#   Edge Function (trigger-elo-refresh):
#     GITHUB_PAT            — GitHub fine-grained PAT with actions:write
#     SUPABASE_URL          — same as above
#     SUPABASE_SERVICE_ROLE_KEY — same key as SUPABASE_SERVICE_KEY
#     SUPABASE_ANON_KEY     — Supabase anon/public key
#   pg_cron Vault secrets:
#     project_url           — Supabase project URL
#     anon_key              — Supabase anon key

jobs:
  ingest:
    name: Backend ingest and manual Elo recompute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --frozen --project packages/backend

      - name: Run data ingestion
        run: uv run --project packages/backend python packages/backend/src/ingest.py --days 7 --min-players 32

      - name: Recompute global Elo, state activity, game events, and commander profiles
        run: |
          if [ "${{ inputs.refresh_mode }}" = "full" ]; then
            if [ -n "${{ inputs.job_id }}" ]; then
              uv run --project packages/backend python packages/backend/src/regional_elo.py --apply --job-id "${{ inputs.job_id }}"
            else
              uv run --project packages/backend python packages/backend/src/regional_elo.py --apply
            fi
          else
            uv run --project packages/backend python packages/backend/src/regional_elo.py --smoke-days "${{ inputs.smoke_days }}" --dry-run
          fi

      - name: Mark queued job as failed when maintenance workflow fails
        if: ${{ failure() && inputs.refresh_mode == 'full' && inputs.job_id != '' }}
        env:
          JOB_ID: ${{ inputs.job_id }}
          JOB_ERROR: GitHub Actions workflow failed in run ${{ github.run_id }}. Inspect the CI Backend Maintenance logs for details.
        run: |
          uv run --project packages/backend python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("packages/backend/src").resolve()))

          from ingest import SupabaseClient
          from regional_elo import fail_job

          client = SupabaseClient(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SERVICE_KEY"],
          )
          fail_job(client, os.environ["JOB_ID"], os.environ["JOB_ERROR"])
          PY

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-logs
          path: packages/backend/logs/
          retention-days: 30

  validate-views:
    runs-on: ubuntu-latest
    needs: ingest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --frozen --project packages/backend

      - name: Validate backend views and functions
        run: uv run --project packages/backend python packages/backend/src/ci_backend_checks.py views

  validate-data-integrity:
    runs-on: ubuntu-latest
    needs: ingest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --frozen --project packages/backend

      - name: Check data integrity
        run: uv run --project packages/backend python packages/backend/src/ci_backend_checks.py data-integrity

  validate-regional-elo-consistency:
    runs-on: ubuntu-latest
    needs: ingest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --frozen --project packages/backend

      - name: Check regional Elo aggregate consistency
        run: uv run --project packages/backend python packages/backend/src/ci_backend_checks.py regional-elo

  benchmark-performance:
    runs-on: ubuntu-latest
    needs: ingest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --frozen --project packages/backend

      - name: Benchmark analytics surfaces
        run: |
          if [ "${{ inputs.refresh_mode }}" = "full" ]; then
            uv run --project packages/backend python packages/backend/src/ci_backend_checks.py benchmark \
              --output benchmark_results.json
          else
            uv run --project packages/backend python packages/backend/src/ci_backend_checks.py benchmark \
              --smoke-only \
              --output benchmark_results.json
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
