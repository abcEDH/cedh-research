name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install
        working-directory: .

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Alias Production Domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: vem-3506s-projects
          VERCEL_PROJECT_NAME: cedh-research
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set; skipping alias step."
            exit 0
          fi

          PROJECT_JSON=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?teamId=$VERCEL_TEAM_ID")
          PROJECT_ID=$(echo "$PROJECT_JSON" | node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(0,'utf8'));console.log(d.id||'')")
          if [ -z "$PROJECT_ID" ]; then
            echo "Could not resolve Vercel project id for $VERCEL_PROJECT_NAME"
            exit 1
          fi

          DEPLOY_JSON=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&target=production&limit=1&teamId=$VERCEL_TEAM_ID")
          DEPLOY_URL=$(echo "$DEPLOY_JSON" | node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(0,'utf8'));console.log((d.deployments&&d.deployments[0]&&d.deployments[0].url)||'')")
          if [ -z "$DEPLOY_URL" ]; then
            echo "Could not resolve latest production deployment."
            exit 1
          fi

          npx vercel@latest alias set "https://$DEPLOY_URL" cedh-research.vercel.app \
            --scope "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN"
