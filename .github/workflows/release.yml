name: Release

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Create release bot token
        id: release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TEDH_RELEASE_APP_ID }}
          private-key: ${{ secrets.TEDH_RELEASE_APP_PRIVATE_KEY }}
          owner: abcEDH
          repositories: cedh-research

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
        run: npm run release
