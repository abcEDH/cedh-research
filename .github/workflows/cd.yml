name: CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  alias-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://cedh-research.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Get latest production deployment URL
        run: |
          echo "Fetching latest production deployment..."
          DEPLOYMENTS=$(vercel ls --token "$VERCEL_TOKEN" --scope vem-3506s-projects --json 2>/dev/null)

          if [ -z "$DEPLOYMENTS" ]; then
            echo "Failed to list deployments"
            exit 1
          fi

          # Get the most recent production deployment
          DEPLOY_URL=$(echo "$DEPLOYMENTS" | node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync(0, 'utf8'));
            const deployments = data.deployments || [];
            const prodDeploys = deployments.filter(d => d.target === 'production');
            if (prodDeploys.length > 0) {
              console.log(prodDeploys[0].url);
            }
          ")

          if [ -z "$DEPLOY_URL" ]; then
            echo "No production deployment found"
            exit 1
          fi

          echo "Latest production deployment: $DEPLOY_URL"
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Alias production domain
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "No deployment URL available"
            exit 1
          fi
          
          echo "Aliasing https://$DEPLOY_URL to cedh-research.vercel.app..."
          vercel alias set "https://$DEPLOY_URL" "cedh-research.vercel.app" \
            --token "$VERCEL_TOKEN" \
            --scope "vem-3506s-projects"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
