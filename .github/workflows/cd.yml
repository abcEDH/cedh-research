name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  alias-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://cedh-research.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Get latest production deployment URL
        run: |
          echo "Fetching latest production deployment from Vercel API..."
          RESPONSE=$(curl -sf \
            "https://api.vercel.com/v9/projects/cedh-research/deployments?target=production&limit=1&slug=vem-3506s-projects" \
            -H "Authorization: Bearer $VERCEL_TOKEN")

          if [ -z "$RESPONSE" ]; then
            echo "Failed to fetch deployments from Vercel API"
            exit 1
          fi

          DEPLOY_URL=$(echo "$RESPONSE" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const d = (data.deployments || [])[0];
            if (d) console.log(d.url);
          ")

          if [ -z "$DEPLOY_URL" ]; then
            echo "No production deployment found"
            exit 1
          fi

          echo "Latest production deployment: $DEPLOY_URL"
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Alias production domain
        run: |
          echo "Aliasing https://$DEPLOY_URL to cedh-research.vercel.app..."
          vercel alias set "https://$DEPLOY_URL" "cedh-research.vercel.app" \
            --token "$VERCEL_TOKEN" \
            --scope "vem-3506s-projects"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
