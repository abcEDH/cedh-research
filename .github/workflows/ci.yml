name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  regional-elo-feedback:
    name: Regional Elo Feedback Loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          pip install requests

      - name: Run focused regional Elo regression tests
        run: npm --workspace apps/web run test -- --run tests/regional-elo/player-stats.test.ts tests/regional-elo/player-page.test.ts

      - name: Generate regional Elo evidence
        run: |
          mkdir -p artifacts
          python << 'SCRIPT'
          import json
          import os
          from pathlib import Path
          import requests
          import time

          base = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1"
          key = os.environ["SUPABASE_SERVICE_KEY"]
          headers = {"apikey": key, "Authorization": f"Bearer {key}"}

          def get(table, params):
            resp = None
            for attempt in range(3):
              resp = requests.get(f"{base}/{table}", headers=headers, params=params, timeout=30)
              if resp.status_code < 500:
                break
              if attempt < 2:
                time.sleep(2 ** attempt)
            try:
              resp.raise_for_status()
            except requests.HTTPError as error:
              raise requests.HTTPError(f"{error}; body={resp.text[:500]}") from error
            return resp.json()

          leaderboard_candidates = get(
            "regional_elo_leaderboard",
            {
              "select": "player_id,region_key,rank,rating,games_played,wins,draws,losses",
              "region_type": "eq.state",
              "games_played": "gt.0",
              "order": "games_played.desc,rating.desc",
              "limit": 10,
            },
          )
          if not leaderboard_candidates:
            raise SystemExit("No regional_elo_leaderboard rows found for region_type=state and games_played>0")

          leaderboard = None
          canonical = None
          player = None
          region = None

          for candidate in leaderboard_candidates:
            candidate_region = candidate["region_key"]
            candidate_player_id = candidate["player_id"]
            canonical_rows = get(
              "regional_elo_player_stats",
              {
                "select": "player_id,games_played,wins,draws,losses",
                "region_type": "eq.state",
                "region_key": f"eq.{candidate_region}",
                "player_id": f"eq.{candidate_player_id}",
              },
            )
            if not canonical_rows:
              continue

            player_rows = get(
              "players",
              {"select": "id,name,topdeck_id", "id": f"eq.{candidate_player_id}"},
            )
            if not player_rows:
              continue

            leaderboard = candidate
            canonical = canonical_rows[0]
            player = player_rows[0]
            region = candidate_region
            break

          if leaderboard is None or canonical is None or player is None or region is None:
            raise SystemExit(
              "No stable regional Elo evidence sample found from the top leaderboard candidates"
            )

          mismatches = {}
          for field in ("games_played", "wins", "draws", "losses"):
            if leaderboard[field] != canonical[field]:
              mismatches[field] = {
                "leaderboard": leaderboard[field],
                "canonical": canonical[field],
              }

          report = {
            "player": player,
            "region": region,
            "leaderboard": leaderboard,
            "canonical": canonical,
            "mismatches": mismatches,
          }

          Path("artifacts/regional-elo-proof.json").write_text(json.dumps(report, indent=2))
          Path("artifacts/regional-elo-proof.md").write_text(
            "\n".join(
              [
                "# Regional Elo Proof",
                "",
                f"- Player: {player['name']} ({player['topdeck_id']})",
                f"- Region: {region}",
                f"- Rank: #{leaderboard['rank']}",
                f"- Elo: {round(leaderboard['rating'])}",
                f"- Leaderboard games: {leaderboard['games_played']}",
                f"- Leaderboard record: {leaderboard['wins']}-{leaderboard['losses']}-{leaderboard['draws']}",
                f"- Canonical games: {canonical['games_played']}",
                f"- Canonical record: {canonical['wins']}-{canonical['losses']}-{canonical['draws']}",
                f"- Mismatches: {'none' if not mismatches else json.dumps(mismatches)}",
              ]
            )
          )

          if mismatches:
            raise SystemExit(f"Regional Elo mismatch detected: {json.dumps(mismatches)}")
          SCRIPT

      - name: Publish evidence to job summary
        run: cat artifacts/regional-elo-proof.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: regional-elo-proof
          path: artifacts/
          retention-days: 14
