[project]
name = "cedh-research-backend"
version = "0.1.0"
description = "Backend ingestion and analytics utilities for cEDH research"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2.6",
  "scikit-learn>=1.7.2",
  "python-dateutil>=2.8.2",
  "psycopg2-binary>=2.9.9",
  "requests>=2.31.0",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=9.0.3",
  "ruff>=0.9.10",
  "types-python-dateutil>=2.8.19.20240311",
  "types-requests>=2.31.0.20240406",
]

[tool.uv]
package = false
# Exclude packages published within the last 7 days to reduce supply chain attack exposure.
# Update this date intentionally when upgrading dependencies.
exclude-newer = "2026-05-06T00:00:00Z"
